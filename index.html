<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>30x Speed vs Factorial</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 110;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_BAR_Y0 = [TOP_ARENA_Y1, TOP_ARENA_Y1 + BAR_H, TOP_ARENA_Y1 + BAR_H * 2];
const TOP_BAR_Y1 = TOP_BAR_Y0.map(y => y + BAR_H);
const TOP_CHECKER_Y0 = TOP_BAR_Y1[2];
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_BAR_Y0 = [BOT_ARENA_Y1, BOT_ARENA_Y1 + BAR_H, BOT_ARENA_Y1 + BAR_H * 2];
const BOT_BAR_Y1 = BOT_BAR_Y0.map(y => y + BAR_H);
const BOT_CHECKER_Y0 = BOT_BAR_Y1[2];
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Balken-Stufen: Index 0 = direkt unter der Arena (kleinstes Leben),
// Index 2 = ganz unten / au\u00dfen (gr\u00f6\u00dftes Leben)
const BAR_HEALTHS = [1000000, 10000000, 100000000];
const TOP_COUNT = 100;
const TOP_COLOR = '#e85fd0';
const BOT_COLOR = '#f0df55';
const GRAVITY = 0.22;
const MAX_FALL_SPEED = 7;
const BOUNCE_VY = 10; // fixe Absprunggeschwindigkeit -> immer gleiche Sprunghöhe
const BOT_BOUNCE_VY = 10; // Fibonacci-Ball springt genauso hoch wie die Speed-Balls
const SLOWMO = 0.15; // Zeitfaktor für den Fibonacci-Ball (1 = normal, kleiner = langsamer)

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
let lastTopSound = 0;
function topHitSound() {
  const now = performance.now();
  if (now - lastTopSound < 70) return;
  lastTopSound = now;
  beep(500, 0.05, 'square', 0.05);
}
function botHitSound(hitCount) {
  beep(220 + hitCount * 15, 0.22, 'triangle', 0.18);
}
function winSound() {
  [440, 554, 659, 880].forEach((f, i) => {
    setTimeout(() => beep(f, 0.3, 'triangle', 0.16), i * 140);
  });
}

let topBalls, botBall, topBars, botBars, topHitCount, botHitCount, popups, gameOver, winner, started;

function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) {
    const c = a + b;
    a = b;
    b = c;
  }
  return b;
}

// Schaden geht immer auf den ersten noch lebenden Balken (Index 0 zuerst)
function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) {
      bars[i] -= dmg;
      if (bars[i] < 0) bars[i] = 0;
      return;
    }
  }
}
function isFullyDepleted(bars) {
  return bars.every(h => h <= 0);
}
// Index des ersten noch lebenden Balkens - bestimmt, wo der Ball gerade abprallt
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

function init() {
  topBalls = [];
  for (let i = 0; i < TOP_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    topBalls.push({
      x: 20 + Math.random() * (W - 40),
      y: TOP_ARENA_Y0 + 15 + Math.random() * (ARENA_H - 30),
      vx: Math.cos(angle) * 18,
      vy: Math.sin(angle) * 18,
      r: 6,
    });
  }
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2,
    y: BOT_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * 3,
    vy: Math.sin(bAngle) * 3,
    r: 11,
  };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  botHitCount = 0;
  topHitCount = 0;
  popups = [];
  gameOver = false;
  winner = null;
  started = false;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, age: 0 });
}

function update() {
  if (!started || gameOver) return;

  // Top: 30 schnelle B\u00e4lle - Gravitation, Schaden NUR beim Kontakt mit der
  // unteren Wand. Die Wand liegt am oberen schwarzen Rand des ersten noch
  // lebenden Balkens - verschwindet ein Balken, r\u00fcckt die Wand eine
  // Balkenh\u00f6he weiter nach unten.
  const topFloor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
  const tx0 = 10, tx1 = W - 10, ty0 = TOP_ARENA_Y0 + 8, ty1 = topFloor - 8;
  for (const b of topBalls) {
    b.vy += GRAVITY;
    if (b.vy > MAX_FALL_SPEED) b.vy = MAX_FALL_SPEED;
    b.x += b.vx;
    b.y += b.vy;
    if (b.x - b.r < tx0) { b.x = tx0 + b.r; b.vx *= -1; }
    if (b.x + b.r > tx1) { b.x = tx1 - b.r; b.vx *= -1; }
    if (b.y - b.r < ty0) { b.y = ty0 + b.r; b.vy *= -1; }
    if (b.y + b.r > ty1) {
      b.y = ty1 - b.r;
      b.vy = -BOUNCE_VY; // immer gleich hoher Sprung, egal aus welcher Fallh\u00f6he
      if (!isFullyDepleted(topBars)) {
        topHitCount++;
        const dmg = topHitCount;
        applyDamage(topBars, dmg);
        addPopup(b.x, b.y, '-' + dmg, TOP_COLOR);
        topHitSound();
      }
    }
  }

  // Unten: 1 Fibonacci-Ball in Zeitlupe - Gravitation & Bewegung mit
  // Zeitfaktor gestreckt, damit die Flugbahn/Sprunghöhe gleich bleibt,
  // nur eben viel langsamer abl\u00e4uft
  const botFloor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
  const bx0 = 14, bx1 = W - 14, by0 = BOT_ARENA_Y0 + 12, by1 = botFloor - 12;
  botBall.vy += GRAVITY * SLOWMO;
  if (botBall.vy > MAX_FALL_SPEED * SLOWMO) botBall.vy = MAX_FALL_SPEED * SLOWMO;
  botBall.x += botBall.vx * SLOWMO;
  botBall.y += botBall.vy;
  if (botBall.x - botBall.r < bx0) { botBall.x = bx0 + botBall.r; botBall.vx *= -1; }
  if (botBall.x + botBall.r > bx1) { botBall.x = bx1 - botBall.r; botBall.vx *= -1; }
  if (botBall.y - botBall.r < by0) { botBall.y = by0 + botBall.r; botBall.vy *= -1; }
  if (botBall.y + botBall.r > by1) {
    botBall.y = by1 - botBall.r;
    botBall.vy = -BOT_BOUNCE_VY * SLOWMO; // immer gleich hoher Sprung, egal aus welcher Fallh\u00f6he
    if (!isFullyDepleted(botBars)) {
      botHitCount++;
      const dmg = fibonacci(botHitCount);
      applyDamage(botBars, dmg);
      addPopup(botBall.x, botBall.y, '-' + dmg.toLocaleString('de-DE'), BOT_COLOR);
      botHitSound(botHitCount);
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }

  if (isFullyDepleted(topBars)) { gameOver = true; winner = 'bot'; }
  else if (isFullyDepleted(botBars)) { gameOver = true; winner = 'top'; }
}

function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}

function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}

function drawHealthBar(y0, y1, bg, health) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  ctx.fillStyle = bg;
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.fillStyle = '#111';
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.max(0, Math.round(health)).toLocaleString('de-DE'), W / 2, (y0 + y1) / 2);
}

function drawSideBars(bars, arenaY1orig, color) {
  const activeIdx = getActiveBarIndex(bars);
  const floor = arenaY1orig + activeIdx * BAR_H;
  for (let i = activeIdx; i < bars.length; i++) {
    const y0 = floor + (i - activeIdx) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, color, bars[i]);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  // Top-Label
  ctx.fillStyle = TOP_COLOR;
  ctx.font = '900 18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('100x SPEED BALLS', W / 2, LABEL_H / 2);

  // Top-Arena (reicht dynamisch bis zum aktuellen Boden-Balken)
  const topActiveIdx = getActiveBarIndex(topBars);
  const topFloorY = TOP_ARENA_Y1 + topActiveIdx * BAR_H;
  drawArenaBg(TOP_ARENA_Y0, topFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_ARENA_Y0, W, topFloorY - TOP_ARENA_Y0);
  ctx.clip();
  if (!isFullyDepleted(topBars)) {
    for (const b of topBalls) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = TOP_COLOR;
      ctx.fill();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = '#000';
      ctx.stroke();
    }
  }
  for (const p of popups) {
    if (p.color !== TOP_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 13px Arial';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = TOP_COLOR;
  ctx.fillText('DAMAGE: ' + (topHitCount + 1), 12, TOP_ARENA_Y0 + 14);

  drawSideBars(topBars, TOP_ARENA_Y1, TOP_COLOR);
  drawChecker(TOP_CHECKER_Y0, TOP_CHECKER_Y1);

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 24px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  // Bottom-Label
  ctx.fillStyle = '#b8a820';
  ctx.font = '900 18px Arial';
  ctx.fillText('FIBONACCI BALL', W / 2, (BOT_LABEL_Y0 + BOT_LABEL_Y1) / 2);

  // Bottom-Arena (reicht dynamisch bis zum aktuellen Boden-Balken)
  const botActiveIdx = getActiveBarIndex(botBars);
  const botFloorY = BOT_ARENA_Y1 + botActiveIdx * BAR_H;
  drawArenaBg(BOT_ARENA_Y0, botFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, BOT_ARENA_Y0, W, botFloorY - BOT_ARENA_Y0);
  ctx.clip();
  if (!isFullyDepleted(botBars)) {
    ctx.beginPath();
    ctx.arc(botBall.x, botBall.y, botBall.r, 0, Math.PI * 2);
    ctx.fillStyle = BOT_COLOR;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#000';
    ctx.stroke();
  }
  for (const p of popups) {
    if (p.color !== BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = '#8a7a10';
    ctx.font = 'bold 15px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = '#8a7a10';
  ctx.fillText('DAMAGE: ' + fibonacci(botHitCount + 1).toLocaleString('de-DE'), 12, BOT_ARENA_Y0 + 14);

  drawSideBars(botBars, BOT_ARENA_Y1, BOT_COLOR);
  drawChecker(BOT_CHECKER_Y0, BOT_CHECKER_Y1);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
