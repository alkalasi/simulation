<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Growing Bouncing Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  canvas {
    display: block;
  }
  #title {
    position: relative;
    margin-top: 4%;
    color: #fff;
    font-weight: 900;
    font-size: clamp(18px, 4vw, 28px);
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    width: 92%;
    line-height: 1.15;
  }
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #restart {
    position: relative;
    margin-top: 6%;
    background: #17b3d4;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #restart:hover { background: #12a0be; }
  #start-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #7a0d0d;
    font-weight: 900;
    font-size: clamp(24px, 6vw, 40px);
    text-align: center;
    cursor: pointer;
    background: rgba(255,255,255,0.85);
    padding: 14px 24px;
    border-radius: 16px;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="title">Everytime the ball bounces it gets bigger until<br>my PC crashes</div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start</div>
  </div>
</div>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function size() {
  const reserved = 160;
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight - reserved);
  canvas.width = s;
  canvas.height = s;
}
size();

const circle = {
  cx: canvas.width / 2,
  cy: canvas.height / 2,
  r: canvas.width / 2 - 12
};

const START_RADIUS = 8;
const START_SPEED = 3.2;
const RADIUS_GROWTH = 1.045;
const SPEED_GROWTH = 1.03;
const MAX_RADIUS = circle.r;
const MAX_SPEED = START_SPEED * 6;
const HUE_SPEED = 2.2;
const STROKE_WIDTH = 3;
const GRAVITY = 0.18;

let clipped = false;

song.preload = 'auto';
song.volume = 1;

const CHAIN_WINDOW_MS = 700;
const SONG_START_TIME = 0; // Song beginnt wieder bei 0:00
let chainActive = false;
let chainTimeout = null;

function ensureAudio() {
  // Song stumm anspielen, um Autoplay-Sperre früh zu lösen (iOS/Chrome)
  song.play().then(() => {
    song.pause();
    song.currentTime = 0;
  }).catch(() => {});
}
document.addEventListener('click', ensureAudio);
document.addEventListener('touchstart', ensureAudio);
document.addEventListener('keydown', ensureAudio);

function stopChain() {
  song.pause();
  // load() statt nur currentTime setzen: Safari übernimmt ein reines
  // "currentTime = 0" nach pause() manchmal nicht zuverlässig, wodurch der
  // Song beim nächsten Aufprall einfach an der alten Stelle weiterläuft
  // statt neu zu starten. load() erzwingt einen echten Reset auf 0.
  song.load();
  chainActive = false;
  chainTimeout = null;
}

function playBounceSound() {
  if (chainTimeout) {
    clearTimeout(chainTimeout);
    chainTimeout = null;
  }
  if (!chainActive) {
    // Neue Kette startet ab Sekunde 0 (nach stopChain() ist load() bereits
    // gelaufen, currentTime ist also schon 0 - hier zur Sicherheit nochmal)
    song.currentTime = SONG_START_TIME;
    song.play().catch(() => {});
    chainActive = true;
  }
  // Läuft die Kette bereits, spielt der Song einfach an seiner aktuellen
  // Position weiter (nicht zurücksetzen) -> Kette bleibt zusammenhängend.
  chainTimeout = setTimeout(stopChain, CHAIN_WINDOW_MS);
}
// --- Ende Sound Engine ---

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function drawBackground() {
  // Weißer Kreis mit dunkelrotem Rand als Basis
  ctx.beginPath();
  ctx.arc(circle.cx, circle.cy, circle.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#7a0d0d';
  ctx.stroke();
}

function applyClip() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(circle.cx, circle.cy, circle.r, 0, Math.PI * 2);
  ctx.clip();
  clipped = true;
}

function initBall() {
  const dir = Math.random() * Math.PI * 2;
  ball = {
    x: circle.cx,
    y: circle.cy,
    vx: Math.cos(dir) * START_SPEED,
    vy: Math.sin(dir) * START_SPEED,
    r: START_RADIUS,
    hue: Math.random() * 360
  };
}

function init() {
  if (chainTimeout) clearTimeout(chainTimeout);
  song.pause();
  song.load();
  chainActive = false;
  if (clipped) {
    ctx.restore();
    clipped = false;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  applyClip();
  initBall();
  started = false;
  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'flex';
}
init();

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if (e.key === 'k' || e.key === 'K') startGame();
});

function update() {
  if (!started) return;

  ball.vy += GRAVITY;
  ball.x += ball.vx;
  ball.y += ball.vy;

  const d = dist(ball.x, ball.y, circle.cx, circle.cy);
  if (d + ball.r > circle.r) {
    const nx = (ball.x - circle.cx) / d;
    const ny = (ball.y - circle.cy) / d;
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx -= 2 * dot * nx;
    ball.vy -= 2 * dot * ny;
    const overlap = d + ball.r - circle.r;
    ball.x -= nx * overlap;
    ball.y -= ny * overlap;
    playBounceSound();

    // Größer und schneller bei jedem Aufprall (mit Obergrenze)
    if (ball.r < MAX_RADIUS) ball.r *= RADIUS_GROWTH;
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed < MAX_SPEED) {
      ball.vx *= SPEED_GROWTH;
      ball.vy *= SPEED_GROWTH;
    }
  }

  ball.hue = (ball.hue + HUE_SPEED) % 360;
}

function draw() {
  if (!started) return;
  // Kein clearRect -> Spur akkumuliert sich dauerhaft
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = `hsl(${ball.hue}, 90%, 55%)`;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000000';
  ctx.stroke();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('wrap').insertAdjacentHTML('beforeend',
  '<button id="restart">Neu starten</button>');
document.getElementById('restart').addEventListener('click', init);
</script>
