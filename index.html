<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Unnormal Ball vs Normal Ball</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const ARENA_H = 210;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + ARENA_H;
const TOP_BAR_Y0 = [TOP_ARENA_Y1, TOP_ARENA_Y1 + BAR_H, TOP_ARENA_Y1 + BAR_H * 2];
const TOP_BAR_Y1 = TOP_BAR_Y0.map(y => y + BAR_H);
const TOP_CHECKER_Y0 = TOP_BAR_Y1[2];
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + ARENA_H;
const BOT_BAR_Y0 = [BOT_ARENA_Y1, BOT_ARENA_Y1 + BAR_H, BOT_ARENA_Y1 + BAR_H * 2];
const BOT_BAR_Y1 = BOT_BAR_Y0.map(y => y + BAR_H);
const BOT_CHECKER_Y0 = BOT_BAR_Y1[2];
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Balken: Index 0 = direkt unter der Arena, Index 2 = ganz unten
const BAR_HEALTHS = [1000, 10000000000, 1000000000000000];
const BOT_COLOR = '#111111'; // Black Ball
const GRAVITY = 0.22; // für den Rainbow Ball (72 Treffer nötig)
const BOT_GRAVITY = 0.0264; // viel schwächer für den Black Ball (nur 18 Treffer nötig, muss aber ~70s lange in der Luft bleiben)
const MAX_FALL_SPEED = 30;
const BOUNCE_VY = 6.38; // Rainbow Ball: ~72 Treffer * ~0.97s Periode ≈ 70s
const BOT_BOUNCE_VY = 3.08; // Black Ball: ~18 Treffer * ~3.9s Periode ≈ 70s
const BALL_SPEED = 3.2;
const BOT_BALL_SPEED = 1.6; // Black Ball bewegt sich langsamer

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function topHitSound(n) { beep(320 + (n % 12) * 20, 0.15, 'sine', 0.13); }

// Rainbow Ball: Fibonacci-Schaden (72 Treffer bis leer)
function fibonacci(n) {
  let a = 1, b = 1;
  if (n <= 2) return 1;
  for (let i = 3; i <= n; i++) { const c = a + b; a = b; b = c; }
  return b;
}
// Black Ball: Fakultäts-Schaden (nur 18 Treffer bis leer)
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) {
      bars[i] -= dmg;
      if (bars[i] < 0) bars[i] = 0;
      return;
    }
  }
}
function isFullyDepleted(bars) { return bars.every(h => h <= 0); }
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

function init() {
  const tAngle = Math.random() * Math.PI * 2;
  topBall = {
    x: W / 2,
    y: TOP_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(tAngle) * BALL_SPEED,
    vy: Math.sin(tAngle) * BALL_SPEED,
    r: 15,
    hue: 0,
  };
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2,
    y: BOT_ARENA_Y0 + ARENA_H / 2,
    vx: Math.cos(bAngle) * BOT_BALL_SPEED,
    vy: Math.sin(bAngle) * BOT_BALL_SPEED,
    r: 15,
  };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  popups = [];
  gameOver = false;
  started = false;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  // Stumm anspielen, um Autoplay-Sperre früh zu lösen (iOS/Chrome)
  botMeowSound.play().then(() => {
    botMeowSound.pause();
    botMeowSound.currentTime = 0;
  }).catch(() => {});
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) { popups.push({ x, y, text, color, age: 0 }); }

function update() {
  if (!started || gameOver) return;

  // Oben: Rainbow Ball - Farbe rotiert durch, Schaden verdoppelt sich
  topBall.hue = (topBall.hue + 1.5) % 360;
  const topFloor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
  const tx0 = 12, tx1 = W - 12, ty0 = TOP_ARENA_Y0 + 10, ty1 = topFloor - 10;
  topBall.vy += GRAVITY;
  if (topBall.vy > MAX_FALL_SPEED) topBall.vy = MAX_FALL_SPEED;
  topBall.x += topBall.vx;
  topBall.y += topBall.vy;
  if (topBall.x - topBall.r < tx0) { topBall.x = tx0 + topBall.r; topBall.vx *= -1; }
  if (topBall.x + topBall.r > tx1) { topBall.x = tx1 - topBall.r; topBall.vx *= -1; }
  if (topBall.y - topBall.r < ty0) { topBall.y = ty0 + topBall.r; topBall.vy *= -1; }
  if (topBall.y + topBall.r > ty1) {
    topBall.y = ty1 - topBall.r;
    if (!isFullyDepleted(topBars)) {
      topBall.vy = -BOUNCE_VY;
      topHitCount++;
      const dmg = fibonacci(topHitCount);
      applyDamage(topBars, dmg);
      addPopup(topBall.x, topBall.y, '-' + dmg.toLocaleString('de-DE'), `hsl(${topBall.hue}, 90%, 50%)`);
      topHitSound(topHitCount);
    } else {
      topBall.vy = 0;
      if (!gameOver) gameOver = true;
    }
  }

  // Unten: Black Ball - normaler, linearer Schaden
  const botFloor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
  const bx0 = 12, bx1 = W - 12, by0 = BOT_ARENA_Y0 + 10, by1 = botFloor - 10;
  botBall.vy += BOT_GRAVITY;
  if (botBall.vy > MAX_FALL_SPEED) botBall.vy = MAX_FALL_SPEED;
  botBall.x += botBall.vx;
  botBall.y += botBall.vy;
  if (botBall.x - botBall.r < bx0) { botBall.x = bx0 + botBall.r; botBall.vx *= -1; }
  if (botBall.x + botBall.r > bx1) { botBall.x = bx1 - botBall.r; botBall.vx *= -1; }
  if (botBall.y - botBall.r < by0) { botBall.y = by0 + botBall.r; botBall.vy *= -1; }
  if (botBall.y + botBall.r > by1) {
    botBall.y = by1 - botBall.r;
    if (!isFullyDepleted(botBars)) {
      botBall.vy = -BOT_BOUNCE_VY;
      botHitCount++;
      const dmg = factorial(botHitCount);
      applyDamage(botBars, dmg);
      addPopup(botBall.x, botBall.y, '-' + dmg.toLocaleString('de-DE'), BOT_COLOR);
      botHitSound(botHitCount);
    } else {
      botBall.vy = 0;
      if (!gameOver) gameOver = true;
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
}

function drawChecker(y0, y1, rainbow) {
  const sq = 12;
  let flip = false;
  let hueStep = 0;
  for (let x = 0; x < W; x += sq) {
    if (rainbow) {
      ctx.fillStyle = flip ? '#fff' : `hsl(${(hueStep * 18) % 360}, 85%, 55%)`;
      hueStep++;
    } else {
      ctx.fillStyle = flip ? '#fff' : '#000';
    }
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}
function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}

function drawRainbowHealthBar(y0, y1, health) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#ff0000');
  grad.addColorStop(0.17, '#ff9900');
  grad.addColorStop(0.34, '#ffee00');
  grad.addColorStop(0.5, '#33cc33');
  grad.addColorStop(0.67, '#0066ff');
  grad.addColorStop(0.84, '#6600cc');
  grad.addColorStop(1, '#cc00cc');
  ctx.fillStyle = grad;
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.fillStyle = '#fff';
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 4;
  ctx.fillText(Math.max(0, Math.round(health)).toLocaleString('de-DE'), W / 2, (y0 + y1) / 2);
  ctx.shadowBlur = 0;
}
function drawBlackHealthBar(y0, y1, health) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  ctx.fillStyle = '#111';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.fillStyle = '#fff';
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.max(0, Math.round(health)).toLocaleString('de-DE'), W / 2, (y0 + y1) / 2);
}
function drawSideBars(bars, arenaY1orig, drawFn) {
  const activeIdx = getActiveBarIndex(bars);
  const floor = arenaY1orig + activeIdx * BAR_H;
  for (let i = activeIdx; i < bars.length; i++) {
    const y0 = floor + (i - activeIdx) * BAR_H;
    drawFn(y0, y0 + BAR_H, bars[i]);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  // Top-Label
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#ff0000');
  grad.addColorStop(0.5, '#00cc44');
  grad.addColorStop(1, '#6600cc');
  ctx.fillStyle = grad;
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('UNNORMAL BALL', W / 2, LABEL_H / 2);

  const topActiveIdx = getActiveBarIndex(topBars);
  const topFloorY = TOP_ARENA_Y1 + topActiveIdx * BAR_H;
  drawArenaBg(TOP_ARENA_Y0, topFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_ARENA_Y0, W, topFloorY - TOP_ARENA_Y0);
  ctx.clip();
  ctx.beginPath();
  ctx.arc(topBall.x, topBall.y, topBall.r, 0, Math.PI * 2);
  ctx.fillStyle = `hsl(${topBall.hue}, 90%, 55%)`;
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  for (const p of popups) {
    if (p.color === BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 14px Arial';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = `hsl(${topBall.hue}, 90%, 40%)`;
  ctx.fillText('DAMAGE: ' + fibonacci(topHitCount + 1).toLocaleString('de-DE'), 12, TOP_ARENA_Y0 + 14);

  drawSideBars(topBars, TOP_ARENA_Y1, drawRainbowHealthBar);
  drawChecker(TOP_CHECKER_Y0, TOP_CHECKER_Y1, true);

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  // Bottom-Label
  ctx.fillStyle = BOT_COLOR;
  ctx.font = '900 20px Arial';
  ctx.fillText('NORMAL BALL', W / 2, (BOT_LABEL_Y0 + BOT_LABEL_Y1) / 2);

  const botActiveIdx = getActiveBarIndex(botBars);
  const botFloorY = BOT_ARENA_Y1 + botActiveIdx * BAR_H;
  drawArenaBg(BOT_ARENA_Y0, botFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, BOT_ARENA_Y0, W, botFloorY - BOT_ARENA_Y0);
  ctx.clip();
  ctx.beginPath();
  ctx.arc(botBall.x, botBall.y, botBall.r, 0, Math.PI * 2);
  ctx.fillStyle = BOT_COLOR;
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  for (const p of popups) {
    if (p.color !== BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = BOT_COLOR;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = BOT_COLOR;
  ctx.fillText('DAMAGE: ' + factorial(botHitCount + 1).toLocaleString('de-DE'), 12, BOT_ARENA_Y0 + 14);

  drawSideBars(botBars, BOT_ARENA_Y1, drawBlackHealthBar);
  drawChecker(BOT_CHECKER_Y0, BOT_CHECKER_Y1, false);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
