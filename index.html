<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shrinking Polygon Funnel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #faf3e0;
    overflow: hidden;
    height: 100%;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  canvas {
    display: block;
  }
  #shapeName {
    position: relative;
    margin-top: 4%;
    color: #111;
    font-weight: 900;
    font-size: clamp(22px, 6vw, 34px);
    text-align: center;
    text-transform: lowercase;
  }
  #shapeValue {
    position: relative;
    margin-top: 0.2%;
    color: #111;
    font-weight: 900;
    font-size: clamp(18px, 4.5vw, 26px);
    text-align: center;
  }
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1%;
  }
  #start-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-weight: 900;
    font-size: clamp(18px, 4.5vw, 28px);
    text-align: center;
    background: rgba(0,0,0,0.75);
    padding: 14px 22px;
    border-radius: 14px;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
    cursor: pointer;
    z-index: 10;
  }
  #status {
    position: relative;
    margin-top: 2%;
    color: #4caf1e;
    font-weight: 800;
    font-size: 18px;
    text-align: center;
    min-height: 24px;
  }
  #restart {
    position: relative;
    margin-top: 2%;
    background: #17b3d4;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #restart:hover { background: #12a0be; }
</style>
</head>
<body>
<div id="wrap">
  <div id="shapeName">triangle</div>
  <div id="shapeValue">565.00</div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Press K<br>to start</div>
  </div>
  <div id="status"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const nameEl = document.getElementById('shapeName');
const valueEl = document.getElementById('shapeValue');
const statusEl = document.getElementById('status');

function size() {
  const reserved = 230;
  const s = Math.min(window.innerWidth * 0.92, window.innerHeight - reserved);
  canvas.width = s;
  canvas.height = s;
}
size();

const box = { left: 4, right: canvas.width - 4, top: 4, bottom: canvas.height - 4 };

const GAP_WIDTH = canvas.width * 0.1;
const FUNNEL_TOP_Y = box.top + (box.bottom - box.top) * 0.62;
const gapCenterX = (box.left + box.right) / 2;

// Trichterbalken: von den oberen Ecken des Trichterbereichs runter zur Lücke am Boden
const leftBar = {
  x1: box.left, y1: FUNNEL_TOP_Y,
  x2: gapCenterX - GAP_WIDTH / 2, y2: box.bottom
};
const rightBar = {
  x1: box.right, y1: FUNNEL_TOP_Y,
  x2: gapCenterX + GAP_WIDTH / 2, y2: box.bottom
};

const START_RADIUS = canvas.width * 0.26;
const START_VALUE = 565.00;
const SHRINK_FACTOR = 0.92;
const GRAVITY = 0.28;
const BAR_THICKNESS = 10;

let shape = null;
let started = false;
let finished = false;

// --- Polygon-Namen (units + tens + "gon", nach dem gleichen Schema wie "tetrahexacontagon") ---
const UNITS = ['', 'hena', 'di', 'tri', 'tetra', 'penta', 'hexa', 'hepta', 'octa', 'ennea'];
const TENS = { 0: '', 10: 'deca', 20: 'icosa', 30: 'triaconta', 40: 'tetraconta', 50: 'pentaconta', 60: 'hexaconta', 70: 'heptaconta', 80: 'octaconta', 90: 'enneaconta' };
const SPECIAL = { 3: 'triangle', 4: 'square', 5: 'pentagon', 6: 'hexagon', 7: 'heptagon', 8: 'octagon', 9: 'nonagon', 10: 'decagon', 11: 'hendecagon', 12: 'dodecagon' };

function polygonName(n) {
  if (SPECIAL[n]) return SPECIAL[n];
  const tens = Math.floor(n / 10) * 10;
  const units = n % 10;
  return (UNITS[units] + (TENS[tens] || '') + 'gon');
}

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return dist(px, py, x1, y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}

function segmentNormal(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  // Normale zeigt nach "innen" (Richtung Trichtermitte / oben)
  return { nx: -dy / len, ny: dx / len };
}

// --- Sound Engine (Web Audio API) ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* Audio nicht verfügbar */ }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  if (audioCtx) {
    const unlockOsc = audioCtx.createOscillator();
    const unlockGain = audioCtx.createGain();
    unlockGain.gain.value = 0;
    unlockOsc.connect(unlockGain);
    unlockGain.connect(audioCtx.destination);
    unlockOsc.start();
    unlockOsc.stop(audioCtx.currentTime + 0.01);
  }
}

function playBarSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}
// --- Ende Sound Engine ---

function init() {
  started = false;
  finished = false;
  statusEl.textContent = '';
  shape = {
    x: gapCenterX,
    y: box.top + 20,
    vx: (Math.random() - 0.5) * 2,
    vy: 0,
    r: START_RADIUS,
    sides: 3,
    value: START_VALUE,
    rotation: 0
  };
  nameEl.textContent = polygonName(shape.sides);
  valueEl.textContent = shape.value.toFixed(2);

  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'flex';
}
init();

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  const overlay = document.getElementById('start-overlay');
  if (overlay) overlay.style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if (e.key === 'k' || e.key === 'K') startGame();
});

function levelUp() {
  shape.sides++;
  shape.r *= SHRINK_FACTOR;
  shape.value *= SHRINK_FACTOR;
  nameEl.textContent = polygonName(shape.sides);
  valueEl.textContent = shape.value.toFixed(2);
}

function handleBarCollision(bar) {
  const d = pointToSegmentDist(shape.x, shape.y, bar.x1, bar.y1, bar.x2, bar.y2);
  if (d < shape.r + BAR_THICKNESS / 2) {
    const { nx, ny } = segmentNormal(bar.x1, bar.y1, bar.x2, bar.y2);
    // sicherstellen, dass die Normale von der Leiste weg zeigt (Richtung Ball)
    const toShapeX = shape.x - (bar.x1 + bar.x2) / 2;
    const toShapeY = shape.y - (bar.y1 + bar.y2) / 2;
    let nnx = nx, nny = ny;
    if (nnx * toShapeX + nny * toShapeY < 0) { nnx = -nnx; nny = -nny; }

    const dot = shape.vx * nnx + shape.vy * nny;
    if (dot < 0) {
      shape.vx -= 2 * dot * nnx;
      shape.vy -= 2 * dot * nny;
      const overlap = shape.r + BAR_THICKNESS / 2 - d;
      shape.x += nnx * overlap;
      shape.y += nny * overlap;
      playBarSound();
      levelUp();
    }
  }
}

const MAX_SPEED = 14;
const SUBSTEPS = 6;

function moveAndCollideStep() {
  shape.x += shape.vx / SUBSTEPS;
  shape.y += shape.vy / SUBSTEPS;

  // Seiten-/Deckenwände
  if (shape.x - shape.r < box.left) {
    shape.x = box.left + shape.r;
    shape.vx *= -1;
  } else if (shape.x + shape.r > box.right) {
    shape.x = box.right - shape.r;
    shape.vx *= -1;
  }
  if (shape.y - shape.r < box.top) {
    shape.y = box.top + shape.r;
    shape.vy *= -1;
  }

  // Trichterbalken: immer aktiv - die Geometrie sorgt selbst dafür,
  // dass die Form nur durchfällt, wenn sie wirklich in der Lücke sitzt
  handleBarCollision(leftBar);
  handleBarCollision(rightBar);
}

function update() {
  if (!started || finished) return;

  shape.vy += GRAVITY;

  const speed = Math.hypot(shape.vx, shape.vy);
  if (speed > MAX_SPEED) {
    shape.vx = (shape.vx / speed) * MAX_SPEED;
    shape.vy = (shape.vy / speed) * MAX_SPEED;
  }

  shape.rotation += 0.01;

  for (let i = 0; i < SUBSTEPS; i++) {
    moveAndCollideStep();
  }

  // Erfolgreich durch die Lücke gefallen?
  if (shape.y - shape.r > box.bottom) {
    finished = true;
    statusEl.textContent = `Escaped as a ${polygonName(shape.sides)}!`;
    setTimeout(init, 1800);
  }
}

function drawPolygon(x, y, r, sides, rotation) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rotation + (i / sides) * Math.PI * 2;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

const SHAPE_COLORS = ['#22c55e', '#e879f9', '#eab308', '#38bdf8', '#f97316', '#a855f7', '#f43f5e'];

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Trichterbalken
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = BAR_THICKNESS;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(leftBar.x1, leftBar.y1);
  ctx.lineTo(leftBar.x2, leftBar.y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rightBar.x1, rightBar.y1);
  ctx.lineTo(rightBar.x2, rightBar.y2);
  ctx.stroke();

  // Form
  const color = SHAPE_COLORS[(shape.sides - 3) % SHAPE_COLORS.length];
  drawPolygon(shape.x, shape.y, shape.r, shape.sides, shape.rotation);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('wrap').insertAdjacentHTML('beforeend',
  '<button id="restart">Neu starten</button>');
document.getElementById('restart').addEventListener('click', init);
</script>
</body>
</html>
