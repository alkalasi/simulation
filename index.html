<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>1000x Quadratzahlen vs Fakultät - 70 Sekunden</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e9ddc4;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; background: #e9ddc4; }
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="start-overlay">Tap to start<br><span style="font-size:0.6em; opacity:0.85;">(oder K drücken)</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const LABEL_H = 36;
const TOP_ARENA_H = 190;
const BOT_ARENA_H = 220;
const BAR_H = 44;
const CHECKER_H = 14;
const VS_H = 40;

const TOP_LABEL_Y0 = 0;
const TOP_LABEL_Y1 = LABEL_H;
const TOP_ARENA_Y0 = TOP_LABEL_Y1;
const TOP_ARENA_Y1 = TOP_ARENA_Y0 + TOP_ARENA_H;
const TOP_BAR_Y0 = [TOP_ARENA_Y1, TOP_ARENA_Y1 + BAR_H, TOP_ARENA_Y1 + BAR_H * 2];
const TOP_BAR_Y1 = TOP_BAR_Y0.map(y => y + BAR_H);
const TOP_CHECKER_Y0 = TOP_BAR_Y1[2];
const TOP_CHECKER_Y1 = TOP_CHECKER_Y0 + CHECKER_H;

const VS_Y0 = TOP_CHECKER_Y1;
const VS_Y1 = VS_Y0 + VS_H;

const BOT_LABEL_Y0 = VS_Y1;
const BOT_LABEL_Y1 = BOT_LABEL_Y0 + LABEL_H;
const BOT_ARENA_Y0 = BOT_LABEL_Y1;
const BOT_ARENA_Y1 = BOT_ARENA_Y0 + BOT_ARENA_H;
const BOT_BAR_Y0 = [BOT_ARENA_Y1, BOT_ARENA_Y1 + BAR_H, BOT_ARENA_Y1 + BAR_H * 2];
const BOT_BAR_Y1 = BOT_BAR_Y0.map(y => y + BAR_H);
const BOT_CHECKER_Y0 = BOT_BAR_Y1[2];
const BOT_CHECKER_Y1 = BOT_CHECKER_Y0 + CHECKER_H;

const H = BOT_CHECKER_Y1;

canvas.width = W;
canvas.height = H;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H, 1) * 0.94;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// Balken: Index 0 = direkt unter der Arena, Index 2 = ganz unten
const BAR_HEALTHS = [1000, 10000000000, 1000000000000000];
const TOP_COLOR = '#27ae60'; // 300x Quadratzahlen-Bälle (echtes n^2, 100.000 Treffer nötig)
const BOT_COLOR = '#8e44ad'; // Fakultäts-Ball (18 Treffer)
const TOP_COUNT = 1000;

// Fair gerechnet: reine Quadratzahlen brauchen 100.000 Treffer. Mit 1000
// Bällen und ~0.21s Sprungperiode pro Ball ergibt das rechnerisch ~70s.
// Fakultät braucht nur 18 Treffer, dafür eine viel schwächere "Gravitation",
// damit der Ball trotzdem lange genug in der Luft bleibt (~3.9s/Sprung) -> ~70s.
const TOP_BALL_SPEED = 7;
const BOT_GRAVITY = 0.0264;
const BOT_BOUNCE_VY = 3.08;
const MAX_FALL_SPEED = 20;
const BALL_SPEED = 2.2;

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) {}
  } else if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.13, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
let lastTopSound = 0;
function topHitSound() {
  const now = performance.now();
  if (now - lastTopSound < 40) return;
  lastTopSound = now;
  beep(600, 0.04, 'square', 0.05);
}
function botHitSound(n) { beep(220 + n * 14, 0.24, 'triangle', 0.17); }

let topBalls, botBall, topBars, botBars, topHitCount, botHitCount, popups, gameOver, started;

function squareDmg(n) { return n * n; }
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

function applyDamage(bars, dmg) {
  for (let i = 0; i < bars.length; i++) {
    if (bars[i] > 0) {
      bars[i] -= dmg;
      if (bars[i] < 0) bars[i] = 0;
      return;
    }
  }
}
function isFullyDepleted(bars) {
  return bars.every(h => h <= 0);
}
function getActiveBarIndex(bars) {
  for (let i = 0; i < bars.length; i++) if (bars[i] > 0) return i;
  return bars.length;
}

function init() {
  topBalls = [];
  for (let i = 0; i < TOP_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    topBalls.push({
      x: 16 + Math.random() * (W - 32),
      y: TOP_ARENA_Y0 + 12 + Math.random() * (TOP_ARENA_H - 24),
      vx: Math.cos(angle) * TOP_BALL_SPEED,
      vy: Math.sin(angle) * TOP_BALL_SPEED,
      r: 3.5,
    });
  }
  const bAngle = Math.random() * Math.PI * 2;
  botBall = {
    x: W / 2,
    y: BOT_ARENA_Y0 + BOT_ARENA_H / 2,
    vx: Math.cos(bAngle) * BALL_SPEED,
    vy: Math.sin(bAngle) * BALL_SPEED,
    r: 13,
  };
  topBars = BAR_HEALTHS.slice();
  botBars = BAR_HEALTHS.slice();
  topHitCount = 0;
  botHitCount = 0;
  popups = [];
  gameOver = false;
  started = false;

  document.getElementById('start-overlay').style.display = 'flex';
}

function startGame() {
  if (started) return;
  ensureAudio();
  started = true;
  document.getElementById('start-overlay').style.display = 'none';
}
document.getElementById('start-overlay').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if (e.key === 'k' || e.key === 'K') startGame(); });

function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, age: 0 });
}

function update() {
  if (!started || gameOver) return;

  // Oben: 300 Quadratzahlen-Bälle, teilen sich denselben Trefferzähler
  const topFloor = TOP_ARENA_Y1 + getActiveBarIndex(topBars) * BAR_H;
  const tx0 = 8, tx1 = W - 8, ty0 = TOP_ARENA_Y0 + 6, ty1 = topFloor - 6;
  for (const b of topBalls) {
    b.x += b.vx;
    b.y += b.vy;
    if (b.x - b.r < tx0) { b.x = tx0 + b.r; b.vx *= -1; }
    if (b.x + b.r > tx1) { b.x = tx1 - b.r; b.vx *= -1; }
    if (b.y - b.r < ty0) { b.y = ty0 + b.r; b.vy *= -1; }
    if (b.y + b.r > ty1) {
      b.y = ty1 - b.r;
      if (!isFullyDepleted(topBars)) {
        b.vy *= -1;
        topHitCount++;
        const dmg = squareDmg(topHitCount);
        applyDamage(topBars, dmg);
        addPopup(b.x, b.y, '-' + dmg.toLocaleString('de-DE'), TOP_COLOR);
      } else {
        b.vy = 0;
        if (!gameOver) gameOver = true;
      }
    }
  }

  // Unten: Fakultäts-Ball (nur 18 Treffer bis leer, dafür sehr schwache
  // Gravitation - bleibt lange in der Luft)
  const botFloor = BOT_ARENA_Y1 + getActiveBarIndex(botBars) * BAR_H;
  const bx0 = 12, bx1 = W - 12, by0 = BOT_ARENA_Y0 + 10, by1 = botFloor - 10;
  botBall.vy += BOT_GRAVITY;
  if (botBall.vy > MAX_FALL_SPEED) botBall.vy = MAX_FALL_SPEED;
  botBall.x += botBall.vx;
  botBall.y += botBall.vy;
  if (botBall.x - botBall.r < bx0) { botBall.x = bx0 + botBall.r; botBall.vx *= -1; }
  if (botBall.x + botBall.r > bx1) { botBall.x = bx1 - botBall.r; botBall.vx *= -1; }
  if (botBall.y - botBall.r < by0) { botBall.y = by0 + botBall.r; botBall.vy *= -1; }
  if (botBall.y + botBall.r > by1) {
    botBall.y = by1 - botBall.r;
    if (!isFullyDepleted(botBars)) {
      botBall.vy = -BOT_BOUNCE_VY;
      botHitCount++;
      const dmg = factorial(botHitCount);
      applyDamage(botBars, dmg);
      addPopup(botBall.x, botBall.y, '-' + dmg.toLocaleString('de-DE'), BOT_COLOR);
      botHitSound(botHitCount);
    } else {
      botBall.vy = 0;
      if (!gameOver) gameOver = true;
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].age++;
    if (popups[i].age > 40) popups.splice(i, 1);
  }
}

function drawChecker(y0, y1) {
  const sq = 12;
  let flip = false;
  for (let x = 0; x < W; x += sq) {
    ctx.fillStyle = flip ? '#fff' : '#000';
    ctx.fillRect(x, y0, sq, y1 - y0);
    flip = !flip;
  }
}

function drawArenaBg(y0, y1) {
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, y0 + 1.5, W - 3, (y1 - y0) - 3);
}

function drawHealthBar(y0, y1, bg, health) {
  if (health <= 0) {
    ctx.fillStyle = '#e9ddc4';
    ctx.fillRect(0, y0, W, y1 - y0);
    return;
  }
  ctx.fillStyle = bg;
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, y0 + 1, W - 2, (y1 - y0) - 2);
  ctx.fillStyle = '#111';
  ctx.font = '900 20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.max(0, Math.round(health)).toLocaleString('de-DE'), W / 2, (y0 + y1) / 2);
}

function drawSideBars(bars, arenaY1orig, color) {
  const activeIdx = getActiveBarIndex(bars);
  const floor = arenaY1orig + activeIdx * BAR_H;
  for (let i = activeIdx; i < bars.length; i++) {
    const y0 = floor + (i - activeIdx) * BAR_H;
    drawHealthBar(y0, y0 + BAR_H, color, bars[i]);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e9ddc4';
  ctx.fillRect(0, 0, W, H);

  // Top-Label
  ctx.fillStyle = TOP_COLOR;
  ctx.font = '900 18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('1000x SQUARE BALLS', W / 2, LABEL_H / 2);

  // Top-Arena
  const topActiveIdx = getActiveBarIndex(topBars);
  const topFloorY = TOP_ARENA_Y1 + topActiveIdx * BAR_H;
  drawArenaBg(TOP_ARENA_Y0, topFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_ARENA_Y0, W, topFloorY - TOP_ARENA_Y0);
  ctx.clip();
  for (const b of topBalls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = TOP_COLOR;
    ctx.fill();
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = TOP_COLOR;
  ctx.fillText('DAMAGE: ' + squareDmg(topHitCount + 1).toLocaleString('de-DE'), 12, TOP_ARENA_Y0 + 14);

  drawSideBars(topBars, TOP_ARENA_Y1, TOP_COLOR);
  drawChecker(TOP_CHECKER_Y0, TOP_CHECKER_Y1);

  // VS
  ctx.fillStyle = '#111';
  ctx.font = '900 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('VS', W / 2, (VS_Y0 + VS_Y1) / 2);

  // Bottom-Label
  ctx.fillStyle = BOT_COLOR;
  ctx.font = '900 20px Arial';
  ctx.fillText('FACTORIAL BALL', W / 2, (BOT_LABEL_Y0 + BOT_LABEL_Y1) / 2);

  // Bottom-Arena
  const botActiveIdx = getActiveBarIndex(botBars);
  const botFloorY = BOT_ARENA_Y1 + botActiveIdx * BAR_H;
  drawArenaBg(BOT_ARENA_Y0, botFloorY);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, BOT_ARENA_Y0, W, botFloorY - BOT_ARENA_Y0);
  ctx.clip();
  ctx.beginPath();
  ctx.arc(botBall.x, botBall.y, botBall.r, 0, Math.PI * 2);
  ctx.fillStyle = BOT_COLOR;
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#000';
  ctx.stroke();
  for (const p of popups) {
    if (p.color !== BOT_COLOR) continue;
    ctx.globalAlpha = Math.max(0, 1 - p.age / 40);
    ctx.fillStyle = BOT_COLOR;
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - p.age * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px Arial';
  ctx.fillStyle = BOT_COLOR;
  ctx.fillText('DAMAGE: ' + factorial(botHitCount + 1).toLocaleString('de-DE'), 12, BOT_ARENA_Y0 + 14);

  drawSideBars(botBars, BOT_ARENA_Y1, BOT_COLOR);
  drawChecker(BOT_CHECKER_Y0, BOT_CHECKER_Y1);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
